spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024
app:
  payment:
    mock-enabled: ${PAYMENT_MOCK_ENABLED:false}
    default-provider: ${PAYMENT_DEFAULT_PROVIDER:VIETQR}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
  clerk:
    issuer: ${CLERK_ISSUER}
    authorized-parties: ${CLERK_AUTHORIZED_PARTIES}
    audience: ${CLERK_AUDIENCE:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
logging:
  level:
    root: INFO
    com.lumora: INFO
