spring:
  application:
    name: lumorab
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:homestay_booking}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jackson:
    time-zone: UTC
  web:
    error:
      include-message: never
      include-stacktrace: never
server:
  port: ${SERVER_PORT:8080}
app:
  booking:
    hold-duration: ${BOOKING_HOLD_DURATION:15m}
    zone: ${BOOKING_ZONE:Asia/Ho_Chi_Minh}
    max-stay-nights: ${BOOKING_MAX_STAY_NIGHTS:365}
    expiry-enabled: ${BOOKING_EXPIRY_ENABLED:true}
    expiry-interval: ${BOOKING_EXPIRY_INTERVAL:30s}
    expiry-batch-size: ${BOOKING_EXPIRY_BATCH_SIZE:100}
  cancellation:
    free-hours-before-check-in: ${CANCELLATION_FREE_HOURS:48}
    partial-hours-before-check-in: ${CANCELLATION_PARTIAL_HOURS:24}
    zone: ${BOOKING_ZONE:Asia/Ho_Chi_Minh}
  payment:
    mock-enabled: ${PAYMENT_MOCK_ENABLED:true}
    default-provider: ${PAYMENT_DEFAULT_PROVIDER:MOCK}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:lumora-stage7-webhook-secret-key}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:600}
  room-codes:
    enabled: ${ROOM_CODES_ENABLED:true}
    zone: ${ROOM_CODES_ZONE:Asia/Ho_Chi_Minh}
    cron: ${ROOM_CODES_CRON:0 0 0 * * *}
    length: ${ROOM_CODES_LENGTH:6}
  clerk:
    issuer: ${CLERK_ISSUER:}
    authorized-parties: ${CLERK_AUTHORIZED_PARTIES:http://localhost:3000}
    audience: ${CLERK_AUDIENCE:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
