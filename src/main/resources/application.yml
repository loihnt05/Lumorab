spring:
  application:
    name: lumorab
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:homestay_booking}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jackson:
    time-zone: UTC
  web:
    error:
      include-message: never
      include-stacktrace: never
server:
  port: ${SERVER_PORT:8080}
app:
  room-codes:
    enabled: ${ROOM_CODES_ENABLED:true}
    zone: ${ROOM_CODES_ZONE:Asia/Ho_Chi_Minh}
    cron: ${ROOM_CODES_CRON:0 0 0 * * *}
    length: ${ROOM_CODES_LENGTH:6}
  clerk:
    issuer: ${CLERK_ISSUER:}
    authorized-parties: ${CLERK_AUTHORIZED_PARTIES:http://localhost:3000}
    audience: ${CLERK_AUDIENCE:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
